[project]
name = "dyprys"
version = "0.1.0"
description = "Semantic search across a personal library of book-length texts"
requires-python = ">=3.12"
dependencies = [
    # The embedding model runs locally through llama.cpp against a GGUF file.
    "llama-cpp-python>=0.3",
    # Vectors are a memmapped float32 array; numpy is what makes that a slice.
    "numpy>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dyp = "dyprys.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dyprys"]
[tool.pytest.ini_options]
pythonpath = ["."]
