[project]
name = "dyprys"
version = "0.1.0"
description = "Semantic search across a personal library of book-length texts"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Mendel Cyprys", email = "erikmanhem@gmail.com" }]
dependencies = [
    # The embedding model runs locally through llama.cpp against a GGUF file.
    "llama-cpp-python>=0.3",
    # Vectors are a memmapped float32 array; numpy is what makes that a slice.
    "numpy>=2",
]

[project.optional-dependencies]
# httpx is what starlette.testclient drives the app through; it is a test
# dependency of the api extra, not of the server.
dev = ["pytest>=8", "httpx2"]
# The HTTP frontend, and nothing the CLI needs. `dyp serve` imports these
# lazily and says `pip install 'dyprys[api]'` when they are absent, so core
# `dyp` keeps its two runtime dependencies.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2"]

[project.scripts]
dyp = "dyprys.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dyprys"]
[tool.pytest.ini_options]
pythonpath = ["."]
