<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>dyprys</title>
    <script>
      // Before first paint, and deliberately not in React. The stored choice is
      // read after the first render otherwise, which shows the wrong theme for
      // a frame -- a white flash on a dark setup, which is the one direction
      // that is actually unpleasant to look at.
      try {
        var stored = localStorage.getItem("dyprys.theme");
        var dark =
          stored === "dark" ||
          ((!stored || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
